---
id: SOAS-PROD-OUTCOMES
name: Product Outcomes
version: 2.0.0
category: product
purpose: Define user problems, measurable outcomes, non-goals and product success
  criteria.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- product-change
- new-capability
- material-investment
inputs:
  required:
  - product concept
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Define user problems, measurable outcomes, non-goals and product success
    criteria; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate product outcomes behavior using product concept and evidence
    fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how product outcomes failures are
    detected, contained and recovered.
evidence:
  required:
  - product concept
  - problem statement, users and measurable outcomes
  - constraints, dependencies and validated assumptions
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace proposed work from user problem through outcome, constraint, feasibility and
  non-goal.
- Query repository and runtime evidence for product concept; record source, location,
  time and subject version.
- Compare observed behavior with ISO-29148, ISO-25010 without treating automated checks
  as compliance.
test_recipes:
  positive:
  - Demonstrate that a representative user outcome is measurable and technically feasible.
  - 'Confirm required outputs include evidence and objective references: product definition,
    outcome measures, execution manifest update, evidence register update.'
  negative:
  - Challenge the proposal with adoption, dependency, scale, safety and failure assumptions.
failure_modes:
- Delivery output is mistaken for user outcome
- A critical feasibility assumption has no owner or validation plan
- Product Outcomes is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - product definition
  - outcome measures
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-29148
  - ISO-25010
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material product outcomes
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For product outcomes, increase concern when failure crosses a trust, tenant, data,
  safety or recovery boundary.
- Record confidence and priority separately from severity.
