---
id: SOAS-RES-FAILURE
name: Failure and Resilience
version: 2.0.0
category: resilience
purpose: Assess failure modes, containment, degradation, retry storms and recovery
  behaviour.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- production-service
- availability-slo
- stateful-service
inputs:
  required:
  - architecture
  - runtime controls
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess failure modes, containment, degradation, retry storms and recovery
    behaviour; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate failure and resilience behavior using architecture, runtime
    controls and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how failure and resilience failures
    are detected, contained and recovered.
evidence:
  required:
  - architecture
  - runtime controls
  - failure model, recovery objectives and dependency map
  - backup, restore, failover or game-day results
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace critical services and state through failure detection, containment, recovery
  and reconciliation.
- Query repository and runtime evidence for architecture, runtime controls; record
  source, location, time and subject version.
- Compare observed behavior with ISO-25010 without treating automated checks as compliance.
test_recipes:
  positive:
  - Demonstrate an authorized recovery of representative state within declared objectives.
  - 'Confirm required outputs include evidence and objective references: resilience
    report, failure scenario register, execution manifest update, evidence register
    update.'
  negative:
  - Exercise dependency loss, partial failure, stale backup, regional loss and recovery
    interruption safely.
failure_modes:
- Backups exist but restoration and reconciliation are unproven
- Redundancy shares an identity, region or control-plane failure mode
- Failure and Resilience is assessed against documentation that does not match the
  implemented subject version.
outputs:
  required:
  - resilience report
  - failure scenario register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-25010
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material failure and
    resilience boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For failure and resilience, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
