---
id: SOAS-REL-PRODUCTION
name: Production Readiness
version: 2.0.0
category: release
purpose: Assess whether architecture, security, quality, operations and support are
  ready for production.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- release-candidate
- production-service
- environment-promotion
inputs:
  required:
  - release candidate
  - evidence
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess whether architecture, security, quality, operations and support
    are ready for production; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate production readiness behavior using release candidate, evidence
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how production readiness failures
    are detected, contained and recovered.
evidence:
  required:
  - release candidate
  - evidence
  - immutable release artifact and approvals
  - deployment, rollback and readiness evidence
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace the exact artifact through gates, promotion, deployment, monitoring and rollback
  decisions.
- Query repository and runtime evidence for release candidate, evidence; record source,
  location, time and subject version.
- Compare observed behavior with NIST-SSDF, ISO-25010 without treating automated checks
  as compliance.
test_recipes:
  positive:
  - Deploy and verify the candidate through the approved non-production promotion
    path.
  - 'Confirm required outputs include evidence and objective references: production
    readiness report, release checklist, execution manifest update, evidence register
    update.'
  negative:
  - Exercise rollback triggers, incompatible state and partial-deployment behavior
    under authorization.
failure_modes:
- A release opinion covers a different artifact than the deployment
- Rollback exists as a command but has not been proven against current state
- Production Readiness is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - production readiness report
  - release checklist
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - NIST-SSDF
  - ISO-25010
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-QUAL-CHANGE-VERIFICATION
questions:
- ask_when: repository and runtime evidence cannot establish a material production
    readiness boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For production readiness, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
