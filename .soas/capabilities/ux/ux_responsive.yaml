---
id: SOAS-UX-RESPONSIVE
name: Responsive Experience
version: 2.0.0
category: ux
purpose: Assess layouts, touch targets, reflow and experience across supported devices.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- web-ui
- mobile-client
- desktop-client
inputs:
  required:
  - UI
  - device targets
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess layouts, touch targets, reflow and experience across supported
    devices; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate responsive experience behavior using UI, device targets and
    evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how responsive experience failures
    are detected, contained and recovered.
evidence:
  required:
  - UI
  - device targets
  - representative user journeys and rendered states
  - usability observations across supported devices
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace high-value tasks through navigation, content, feedback, error recovery and
  responsive states.
- Query repository and runtime evidence for UI, device targets; record source, location,
  time and subject version.
- Compare observed behavior with WCAG, ISO-9241 without treating automated checks
  as compliance.
test_recipes:
  positive:
  - Have representative users complete critical tasks with observable success criteria.
  - 'Confirm required outputs include evidence and objective references: responsive
    UX report, visual test plan, execution manifest update, evidence register update.'
  negative:
  - Exercise empty, error, slow, interrupted, narrow-screen and first-use states.
failure_modes:
- A polished happy path conceals unrecoverable error states
- Responsive layout preserves pixels but loses task order or meaning
- Responsive Experience is assessed against documentation that does not match the
  implemented subject version.
outputs:
  required:
  - responsive UX report
  - visual test plan
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - WCAG
  - ISO-9241
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material responsive
    experience boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For responsive experience, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
