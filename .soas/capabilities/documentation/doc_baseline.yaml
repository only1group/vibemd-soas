---
id: SOAS-DOC-BASELINE
name: Documentation Baseline
version: 2.0.0
category: documentation
purpose: Create or assure essential product, architecture, engineering and operational
  documentation.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- repository
- onboarding
- architecture-decision
inputs:
  required:
  - repository
  - existing docs
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Create or assure essential product, architecture, engineering and operational
    documentation; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate documentation baseline behavior using repository, existing
    docs and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how documentation baseline failures
    are detected, contained and recovered.
evidence:
  required:
  - repository
  - existing docs
  - versioned documentation and ownership metadata
  - commands or diagrams checked against the assessed revision
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Verify that instructions, diagrams, decisions and references match current source
  and deployment behavior.
- Query repository and runtime evidence for repository, existing docs; record source,
  location, time and subject version.
- Compare observed behavior with ISO-42010, ISO-29148 without treating automated checks
  as compliance.
test_recipes:
  positive:
  - Have an intended reader complete a representative task using only the documented
    procedure.
  - 'Confirm required outputs include evidence and objective references: documentation
    map, missing document register, execution manifest update, evidence register update.'
  negative:
  - Test stale prerequisites, clean-machine setup, failure recovery and broken-link
    paths.
failure_modes:
- Documentation is internally consistent but describes an older release
- Critical operational knowledge has no accountable owner or review trigger
- Documentation Baseline is assessed against documentation that does not match the
  implemented subject version.
outputs:
  required:
  - documentation map
  - missing document register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-42010
  - ISO-29148
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material documentation
    baseline boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For documentation baseline, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
