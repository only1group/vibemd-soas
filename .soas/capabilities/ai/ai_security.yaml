---
id: SOAS-AI-SECURITY
name: AI Security
version: 2.0.0
category: ai
purpose: Assess prompt injection, data leakage, tool abuse, model output handling
  and excessive agency.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- ai-model
- ai-agent
- retrieval-augmented-generation
inputs:
  required:
  - prompts
  - tool definitions
  - source
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess prompt injection, data leakage, tool abuse, model output handling
    and excessive agency; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate ai security behavior using prompts, tool definitions, source
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how ai security failures are detected,
    contained and recovered.
evidence:
  required:
  - prompts
  - tool definitions
  - source
  - model, prompt and tool versions
  - representative evaluation and adversarial results
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace model inputs, context, tools, memory, outputs, human controls and provider
  boundaries.
- Query repository and runtime evidence for prompts, tool definitions, source; record
  source, location, time and subject version.
- Compare observed behavior with OWASP-LLM, NIST-AI-RMF without treating automated
  checks as compliance.
test_recipes:
  positive:
  - Run versioned representative evaluations against explicit quality and safety thresholds.
  - 'Confirm required outputs include evidence and objective references: AI security
    report, adversarial test plan, execution manifest update, evidence register update.'
  negative:
  - Exercise adversarial, ambiguous, out-of-distribution and tool-abuse cases with
    side effects disabled.
failure_modes:
- A model change invalidates unversioned evaluation evidence
- A safe prompt path bypasses controls through tools, retrieval or memory
- AI Security is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - AI security report
  - adversarial test plan
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - OWASP-LLM
  - NIST-AI-RMF
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-AI-ARCHITECTURE
- SOAS-SEC-THREAT-MODEL
questions:
- ask_when: repository and runtime evidence cannot establish a material ai security
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For ai security, increase concern when failure crosses a trust, tenant, data, safety
  or recovery boundary.
- Record confidence and priority separately from severity.
