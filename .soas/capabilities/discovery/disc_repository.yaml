---
id: SOAS-DISC-REPOSITORY
name: Repository Discovery
version: 2.0.0
category: discovery
purpose: Identify codebases, languages, frameworks, dependencies, build tools, tests
  and documentation.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- repository
- material-change
- production-service
inputs:
  required:
  - repository tree
  - manifests
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Identify codebases, languages, frameworks, dependencies, build tools,
    tests and documentation; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate repository discovery behavior using repository tree, manifests
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how repository discovery failures
    are detected, contained and recovered.
evidence:
  required:
  - repository tree
  - manifests
  - repository tree and immutable revision
  - configuration, deployment and dependency inventories
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Reconstruct the assessed system from source, configuration, manifests and deployed
  evidence before relying on documentation.
- Query repository and runtime evidence for repository tree, manifests; record source,
  location, time and subject version.
- Compare observed behavior with NIST-SSDF without treating automated checks as compliance.
test_recipes:
  positive:
  - Trace representative entry points to deployed components and owned data.
  - 'Confirm required outputs include evidence and objective references: repository
    inventory, evidence register, execution manifest update, evidence register update.'
  negative:
  - Search for unrecorded services, generated assets, alternate deployment paths and
    stale documentation.
failure_modes:
- The assessed repository is not the deployed revision
- Material components or environments remain outside the reconstructed scope
- Repository Discovery is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - repository inventory
  - evidence register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - NIST-SSDF
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material repository
    discovery boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For repository discovery, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
