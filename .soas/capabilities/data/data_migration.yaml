---
id: SOAS-DATA-MIGRATION
name: Data Migration
version: 2.0.0
category: data
purpose: Design or assure migration safety, mapping, reconciliation, rollback and
  evidence.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- database
- personal-data
- data-migration
- multi-tenant
inputs:
  required:
  - source and target schema
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Design or assure migration safety, mapping, reconciliation, rollback
    and evidence; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate data migration behavior using source and target schema and
    evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how data migration failures are
    detected, contained and recovered.
evidence:
  required:
  - source and target schema
  - schemas, constraints, queries and data-flow inventory
  - reconciliation, retention or integrity test results
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace ownership, validation, lifecycle, consistency and tenant boundaries from ingress
  to deletion.
- Query repository and runtime evidence for source and target schema; record source,
  location, time and subject version.
- Compare observed behavior with ISO-25010 without treating automated checks as compliance.
test_recipes:
  positive:
  - Verify representative writes, reads, reconciliation and lifecycle operations preserve
    declared invariants.
  - 'Confirm required outputs include evidence and objective references: migration
    plan, reconciliation plan, execution manifest update, evidence register update.'
  negative:
  - Exercise invalid, concurrent, cross-tenant, partial-failure and rollback cases.
failure_modes:
- Application validation is treated as a substitute for persisted constraints
- Happy-path samples conceal partial, stale or cross-tenant data
- Data Migration is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - migration plan
  - reconciliation plan
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-25010
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-DATA-INTEGRITY
- SOAS-RES-RECOVERY
questions:
- ask_when: repository and runtime evidence cannot establish a material data migration
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For data migration, increase concern when failure crosses a trust, tenant, data,
  safety or recovery boundary.
- Record confidence and priority separately from severity.
