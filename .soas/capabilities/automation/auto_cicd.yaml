---
id: SOAS-AUTO-CICD
name: CI/CD Automation
version: 2.0.0
category: automation
purpose: Assess build, test, security, promotion, approvals, provenance and rollback
  automation.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- ci-cd
- environment-promotion
- infrastructure-as-code
inputs:
  required:
  - pipeline config
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess build, test, security, promotion, approvals, provenance and rollback
    automation; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate ci/cd automation behavior using pipeline config and evidence
    fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how ci/cd automation failures are
    detected, contained and recovered.
evidence:
  required:
  - pipeline config
  - versioned pipeline and environment definitions
  - recent promotion, gate and rollback results
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace source revision through build, test, approval, artifact and environment promotion
  controls.
- Query repository and runtime evidence for pipeline config; record source, location,
  time and subject version.
- Compare observed behavior with NIST-SSDF, SLSA without treating automated checks
  as compliance.
test_recipes:
  positive:
  - Reproduce a successful build and promotion from the locked source revision.
  - 'Confirm required outputs include evidence and objective references: CI/CD report,
    pipeline prompts, execution manifest update, evidence register update.'
  negative:
  - Attempt promotion with a failed gate, untrusted artifact or unauthorized actor.
failure_modes:
- A required gate is advisory or bypassable
- The deployed artifact cannot be tied to the assessed source revision
- CI/CD Automation is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - CI/CD report
  - pipeline prompts
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - NIST-SSDF
  - SLSA
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material ci/cd automation
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For ci/cd automation, increase concern when failure crosses a trust, tenant, data,
  safety or recovery boundary.
- Record confidence and priority separately from severity.
