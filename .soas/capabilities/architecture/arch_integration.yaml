---
id: SOAS-ARCH-INTEGRATION
name: Integration Architecture
version: 2.0.0
category: architecture
purpose: Design or assure APIs, events, contracts, timeouts, retries and dependency
  failure handling.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- material-change
- distributed-system
- third-party-integrations
inputs:
  required:
  - integration inventory
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Design or assure APIs, events, contracts, timeouts, retries and dependency
    failure handling; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate integration architecture behavior using integration inventory
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how integration architecture failures
    are detected, contained and recovered.
evidence:
  required:
  - integration inventory
  - implemented component and data-flow views
  - decision records and runtime configuration
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Reconcile documented boundaries and decisions with implemented dependencies and
  runtime topology.
- Query repository and runtime evidence for integration inventory; record source,
  location, time and subject version.
- Compare observed behavior with ISO-42010, OWASP-API without treating automated checks
  as compliance.
test_recipes:
  positive:
  - Trace a critical scenario through components, data stores and failure boundaries.
  - 'Confirm required outputs include evidence and objective references: integration
    architecture, contract register, execution manifest update, evidence register
    update.'
  negative:
  - Remove or degrade a dependency and verify the documented containment and recovery
    behavior.
failure_modes:
- Diagrams describe intended rather than deployed architecture
- A local design decision creates an unrecorded system-wide constraint
- Integration Architecture is assessed against documentation that does not match the
  implemented subject version.
outputs:
  required:
  - integration architecture
  - contract register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-42010
  - OWASP-API
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material integration
    architecture boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For integration architecture, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
