---
id: SOAS-PERF-BACKEND
name: Backend Performance
version: 2.0.0
category: performance
purpose: Assess service latency, resource use, concurrency, caching and dependency
  bottlenecks.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- material-load
- high-growth
- availability-slo
inputs:
  required:
  - APM
  - source
  - load results
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess service latency, resource use, concurrency, caching and dependency
    bottlenecks; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate backend performance behavior using APM, source, load results
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how backend performance failures
    are detected, contained and recovered.
evidence:
  required:
  - APM
  - source
  - load results
  - workload model and service objectives
  - versioned load results and resource telemetry
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Check workload assumptions, bottlenecks, latency distributions, saturation and scaling
  boundaries.
- Query repository and runtime evidence for APM, source, load results; record source,
  location, time and subject version.
- Compare observed behavior with ISO-25010 without treating automated checks as compliance.
test_recipes:
  positive:
  - Run an authorized representative workload and compare percentiles and errors to
    objectives.
  - 'Confirm required outputs include evidence and objective references: backend performance
    report, bottleneck register, execution manifest update, evidence register update.'
  negative:
  - Exercise burst, skew, saturation, slow-dependency and recovery behavior under
    explicit stop conditions.
failure_modes:
- Average latency conceals tail failure
- Synthetic workload omits the expensive production path or data shape
- Backend Performance is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - backend performance report
  - bottleneck register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-25010
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material backend performance
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For backend performance, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
