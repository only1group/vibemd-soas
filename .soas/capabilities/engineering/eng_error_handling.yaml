---
id: SOAS-ENG-ERROR-HANDLING
name: Error Handling
version: 2.0.0
category: engineering
purpose: Assess exception boundaries, error contracts, retries, user messages and
  fail-safe behaviour.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- source-code
- material-change
- remediation
inputs:
  required:
  - source
  - runtime logs
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess exception boundaries, error contracts, retries, user messages
    and fail-safe behaviour; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate error handling behavior using source, runtime logs and evidence
    fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how error handling failures are
    detected, contained and recovered.
evidence:
  required:
  - source
  - runtime logs
  - source, static analysis and review records
  - focused tests and change history
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Inspect changed and risk-bearing code paths for clarity, invariants, errors, coupling
  and maintainability.
- Query repository and runtime evidence for source, runtime logs; record source, location,
  time and subject version.
- Compare observed behavior with ISO-25010, OWASP-ASVS without treating automated
  checks as compliance.
test_recipes:
  positive:
  - Run focused tests that demonstrate intended behavior at public and internal boundaries.
  - 'Confirm required outputs include evidence and objective references: error handling
    assessment, remediation prompts, execution manifest update, evidence register
    update.'
  negative:
  - Exercise invalid input, dependency failure, concurrency and partial-update paths.
failure_modes:
- High coverage masks assertions that do not test behavior
- Local cleanup changes behavior or moves risk across a boundary
- Error Handling is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - error handling assessment
  - remediation prompts
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-25010
  - OWASP-ASVS
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material error handling
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For error handling, increase concern when failure crosses a trust, tenant, data,
  safety or recovery boundary.
- Record confidence and priority separately from severity.
