---
id: SOAS-QUAL-TEST-EFFECTIVENESS
name: Test Effectiveness
version: 2.0.0
category: quality
purpose: Assess whether tests detect meaningful defects rather than merely produce
  coverage.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- source-code
- material-change
- release-candidate
inputs:
  required:
  - tests
  - coverage
  - defect history
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess whether tests detect meaningful defects rather than merely produce
    coverage; establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate test effectiveness behavior using tests, coverage, defect
    history and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how test effectiveness failures
    are detected, contained and recovered.
evidence:
  required:
  - tests
  - coverage
  - defect history
  - risk-based test strategy and traceability
  - versioned test results, mutations or defect history
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Map tests to material behaviors, risks, boundaries and changed code rather than
  coverage percentage alone.
- Query repository and runtime evidence for tests, coverage, defect history; record
  source, location, time and subject version.
- Compare observed behavior with ISO-25010 without treating automated checks as compliance.
test_recipes:
  positive:
  - Demonstrate that representative requirements fail when their implementation is
    deliberately broken.
  - 'Confirm required outputs include evidence and objective references: test effectiveness
    report, test debt register, execution manifest update, evidence register update.'
  negative:
  - Exercise boundary, concurrency, dependency, permission and recovery paths omitted
    by happy-path tests.
failure_modes:
- Tests pass against the wrong artifact or configuration
- Coverage is high but assertions cannot detect a material regression
- Test Effectiveness is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - test effectiveness report
  - test debt register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-25010
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-QUAL-TEST-STRATEGY
questions:
- ask_when: repository and runtime evidence cannot establish a material test effectiveness
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For test effectiveness, increase concern when failure crosses a trust, tenant, data,
  safety or recovery boundary.
- Record confidence and priority separately from severity.
