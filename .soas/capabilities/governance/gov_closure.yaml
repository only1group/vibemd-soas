---
id: SOAS-GOV-CLOSURE
name: Finding Closure
version: 2.0.0
category: governance
purpose: Independently verify remediation and residual risk before closure.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- finding
- risk-decision
- assurance-execution
inputs:
  required:
  - finding
  - remediation evidence
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Independently verify remediation and residual risk before closure; establish
    the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate finding closure behavior using finding, remediation evidence
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how finding closure failures are
    detected, contained and recovered.
evidence:
  required:
  - finding
  - remediation evidence
  - linked findings, decisions, owners and evidence
  - approval, expiry and verification records
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace each material claim from observation through decision, remediation and verification.
- Query repository and runtime evidence for finding, remediation evidence; record
  source, location, time and subject version.
- Compare observed behavior with ISO-31000 without treating automated checks as compliance.
test_recipes:
  positive:
  - Resolve a sampled finding and risk decision end-to-end through linked records.
  - 'Confirm required outputs include evidence and objective references: closure record,
    updated register, execution manifest update, evidence register update.'
  negative:
  - Attempt closure without independent evidence, an owner, an expiry or a reproducible
    verification result.
failure_modes:
- Status changes imply closure without evidence
- Accepted risk persists after scope change or expiry
- Finding Closure is assessed against documentation that does not match the implemented
  subject version.
outputs:
  required:
  - closure record
  - updated register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-31000
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-GOV-FINDINGS
questions:
- ask_when: repository and runtime evidence cannot establish a material finding closure
    boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For finding closure, increase concern when failure crosses a trust, tenant, data,
  safety or recovery boundary.
- Record confidence and priority separately from severity.
