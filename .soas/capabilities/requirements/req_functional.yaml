---
id: SOAS-REQ-FUNCTIONAL
name: Functional Requirements
version: 2.0.0
category: requirements
purpose: Develop testable functional requirements and acceptance criteria.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- product-change
- material-change
- architecture-decision
inputs:
  required:
  - product definition
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Develop testable functional requirements and acceptance criteria; establish
    the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate functional requirements behavior using product definition
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how functional requirements failures
    are detected, contained and recovered.
evidence:
  required:
  - product definition
  - versioned requirements and acceptance criteria
  - stakeholder, constraint and traceability records
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Check that requirements are unambiguous, feasible, measurable, prioritized and traceable
  to risks and tests.
- Query repository and runtime evidence for product definition; record source, location,
  time and subject version.
- Compare observed behavior with ISO-29148 without treating automated checks as compliance.
test_recipes:
  positive:
  - Derive a deterministic acceptance test from each sampled requirement.
  - 'Confirm required outputs include evidence and objective references: requirements
    specification, traceability register, execution manifest update, evidence register
    update.'
  negative:
  - Challenge conflicting, missing, boundary and failure requirements with concrete
    scenarios.
failure_modes:
- A requirement uses subjective language with no decision threshold
- A non-functional constraint has no accountable test or evidence source
- Functional Requirements is assessed against documentation that does not match the
  implemented subject version.
outputs:
  required:
  - requirements specification
  - traceability register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - ISO-29148
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies: []
questions:
- ask_when: repository and runtime evidence cannot establish a material functional
    requirements boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For functional requirements, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
