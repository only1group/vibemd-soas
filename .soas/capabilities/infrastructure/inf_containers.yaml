---
id: SOAS-INF-CONTAINERS
name: Containers and Orchestration
version: 2.0.0
category: infrastructure
purpose: Assess image provenance, runtime privileges, isolation, secrets, policy and
  orchestration reliability.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- cloud-infrastructure
- infrastructure-as-code
- containers
inputs:
  required:
  - Dockerfiles
  - cluster config
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess image provenance, runtime privileges, isolation, secrets, policy
    and orchestration reliability; establish the exact subject, version and boundary
    assessed.
- id: OBJ-02
  objective: Demonstrate containers and orchestration behavior using Dockerfiles,
    cluster config and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how containers and orchestration
    failures are detected, contained and recovered.
evidence:
  required:
  - Dockerfiles
  - cluster config
  - versioned IaC, network and runtime configuration
  - drift, policy and deployment observations
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Compare declared and deployed compute, identity, network, storage and isolation
  controls.
- Query repository and runtime evidence for Dockerfiles, cluster config; record source,
  location, time and subject version.
- Compare observed behavior with CIS-CONTROLS, NIST-SSDF without treating automated
  checks as compliance.
test_recipes:
  positive:
  - Reproduce provisioning and policy checks in a non-production environment.
  - 'Confirm required outputs include evidence and objective references: container
    assurance report, hardening prompts, execution manifest update, evidence register
    update.'
  negative:
  - Exercise denied ingress, egress, privilege, drift and unhealthy-workload cases
    without affecting production.
failure_modes:
- IaC passes while deployed resources have material drift
- Default identities or network paths bypass intended isolation
- Containers and Orchestration is assessed against documentation that does not match
  the implemented subject version.
outputs:
  required:
  - container assurance report
  - hardening prompts
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - CIS-CONTROLS
  - NIST-SSDF
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-DISC-INFRASTRUCTURE
questions:
- ask_when: repository and runtime evidence cannot establish a material containers
    and orchestration boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For containers and orchestration, increase concern when failure crosses a trust,
  tenant, data, safety or recovery boundary.
- Record confidence and priority separately from severity.
