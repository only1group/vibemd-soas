---
id: SOAS-SEC-INFRASTRUCTURE
name: Infrastructure Security
version: 2.0.0
category: security
purpose: Assess cloud, network, host, container and platform security configuration.
profiles:
- guided-engineer
- lead-peer
scopes:
- repository
- component
- environment
- change-set
scope_signals:
- public-api
- identity-provider
- multi-tenant
- privileged-users
inputs:
  required:
  - IaC
  - cloud evidence
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
control_objectives:
- id: OBJ-01
  objective: Assess cloud, network, host, container and platform security configuration;
    establish the exact subject, version and boundary assessed.
- id: OBJ-02
  objective: Demonstrate infrastructure security behavior using IaC, cloud evidence
    and evidence fitted to the claim.
- id: OBJ-03
  objective: Identify unsafe assumptions and show how infrastructure security failures
    are detected, contained and recovered.
evidence:
  required:
  - IaC
  - cloud evidence
  - threat boundaries, security configuration and dependency inventory
  - focused authorization, abuse-case and security test results
  - immutable subject version or commit
  optional:
  - user context
  - organisation standards
  - jurisdiction overlay
  sufficiency:
  - Each applicable control objective has current, scope-matched evidence.
  - At least one positive and one negative procedure is executed or an explicit authorized
    absence reason is recorded.
  - Conflicting or weak evidence is resolved or retained as a limitation; missing
    evidence cannot produce satisfied.
  prohibit:
  - secret values
  - unnecessary personal data
  - unsupported legal or standards compliance claims
inspection_procedures:
- Trace assets, identities, trust boundaries, attacker-controlled input and privileged
  operations.
- Query repository and runtime evidence for IaC, cloud evidence; record source, location,
  time and subject version.
- Compare observed behavior with NIST-CSF, CIS-CONTROLS without treating automated
  checks as compliance.
test_recipes:
  positive:
  - Verify permitted operations for representative identities and protected assets.
  - 'Confirm required outputs include evidence and objective references: infrastructure
    security report, hardening register, execution manifest update, evidence register
    update.'
  negative:
  - Exercise unauthorized, cross-tenant, replay, injection and privilege-transition
    cases in an approved target.
failure_modes:
- Authentication success is mistaken for authorization correctness
- A secure primary path has an alternate endpoint, job or administrative bypass
- Infrastructure Security is assessed against documentation that does not match the
  implemented subject version.
outputs:
  required:
  - infrastructure security report
  - hardening register
  - execution manifest update
  - evidence register update
  required_content:
  - assessed scope and immutable subject version
  - objective-level evidence references and outcome
  - findings, limitations, residual uncertainty and required next action
  finding_format: schemas/finding.schema.json
exit_criteria:
- Every applicable objective has an outcome and evidence references.
- Required outputs exist or have an explicit absence reason.
- Negative and positive procedures are recorded with results or authorization limitations.
- No insufficient-evidence, not-executed or blocked objective is represented as satisfied.
frameworks:
  normative:
  - NIST-CSF
  - CIS-CONTROLS
  advisory: []
  conditional:
  - JUR-AU
  - JUR-US
  - JUR-EU
  rule: activate jurisdiction overlays only where relevant; no industry frameworks
dependencies:
- SOAS-DISC-INFRASTRUCTURE
questions:
- ask_when: repository and runtime evidence cannot establish a material infrastructure
    security boundary or expected behavior
  instruction: Ask for the smallest missing fact needed to decide an objective; record
    the answer as reported evidence or an assumption.
severity_considerations:
- Calibrate impact, exposure, affected users or tenants, detectability, reversibility
  and release-gating effect.
- For infrastructure security, increase concern when failure crosses a trust, tenant,
  data, safety or recovery boundary.
- Record confidence and priority separately from severity.
