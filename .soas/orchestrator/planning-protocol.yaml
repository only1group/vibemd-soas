steps:
- resolve intent
- load profile
- inspect evidence
- identify lifecycle stage
- identify assurance target
- select capabilities
- record every selected and excluded capability with triggering evidence
- resolve dependencies
- estimate materiality
- create execution plan
constraints:
- do not execute unrelated capabilities
- do not omit material cross-cutting risks
- explain selected scope
- treat unresolved material scope signals as uncertainty, not evidence for exclusion
