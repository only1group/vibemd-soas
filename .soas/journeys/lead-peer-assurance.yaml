id: JRN-LEAD-PEER
name: Lead Peer Assurance Journey
profiles:
- lead-peer
- guided-engineer
purpose: Provide independent architecture and engineering assurance for an existing
  system.
scope_resolution:
  protocol: orchestrator/scope-resolution-protocol.yaml
  rules: orchestrator/selection-rules.yaml
  record: schemas/selection-decision.schema.json
stages:
- - reconstruct
  - - SOAS-DISC-REPOSITORY
    - SOAS-DISC-ARCHITECTURE
    - SOAS-DISC-INFRASTRUCTURE
- - challenge
  - - SOAS-ARCH-SOLUTION
    - SOAS-ARCH-TRADEOFFS
    - SOAS-REQ-QUALITY
- - assure
  - - dynamic:scope-resolution
    - SOAS-ENG-MAINTAINABILITY
    - SOAS-QUAL-TEST-STRATEGY
    - SOAS-QUAL-TEST-EFFECTIVENESS
    - SOAS-QUAL-CHANGE-VERIFICATION
    - SOAS-RES-FAILURE
- - operate
  - - SOAS-OPS-OBSERVABILITY
    - SOAS-OPS-RECOVERY
    - SOAS-REL-PRODUCTION
- - conclude
  - - SOAS-GOV-RISK
    - SOAS-GOV-DECISIONS
    - SOAS-REL-OPINION
rules:
- evaluate every scope-selection rule and record selected and excluded decisions
- resolve transitive dependencies before execution
- do not treat insufficient evidence, blocked or not executed as positive assurance
