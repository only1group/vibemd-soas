id: JUR-AU
name: Australia privacy and general security overlay
activation:
- establishment or processing operations in Australia
- Australian data subjects where the processing facts make the law applicable
- offering into or monitoring an Australian market
- contractual requirement
evidence_required:
- establishment and processor/controller relationships
- processing locations and data-subject populations
- markets offered to and relevant contracts
includes:
- Privacy Act 1988 and Australian Privacy Principles
- Notifiable Data Breaches scheme
- OAIC privacy guidance
- ASD secure-by-design and general cyber guidance where relevant
excludes:
- APRA
- ASIC
- SOCI sector obligations
- industry-specific regulation
legal_note: Engineering guidance only; confirm legal applicability with qualified
  counsel.
