id: JUR-EU
name: European privacy and general security overlay
activation:
- EU or EEA data subjects or operations
- offering goods or services into the EU/EEA
- contractual requirement
includes:
- GDPR
- ePrivacy discovery
- European Data Protection Board guidance
- EU AI Act when AI functionality is in scope
- NIS2 discovery only where generally applicable and explicitly selected
excludes:
- DORA
- PSD2
- sector-specific regulation
legal_note: Engineering guidance only; record controller/processor assumptions and
  seek legal confirmation.
