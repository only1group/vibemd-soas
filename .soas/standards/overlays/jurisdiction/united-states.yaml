id: JUR-US
name: United States privacy and general security overlay
activation:
- establishment or processing operations in the United States
- state-resident data subjects where thresholds and processing facts establish applicability
- offering into or monitoring a United States market
- contractual requirement
evidence_required:
- establishment, processing locations and service-provider relationships
- resident populations, processing purposes and applicable thresholds
- markets offered to and relevant contracts
includes:
- NIST Privacy Framework
- FTC privacy and security principles
- applicable state comprehensive privacy laws beginning with CCPA/CPRA where scope
  applies
- state breach notification discovery
excludes:
- HIPAA
- GLBA
- FERPA
- FedRAMP
- industry-specific federal regimes
legal_note: US privacy law is federal-and-state specific. SOAS must identify uncertainty
  and request legal confirmation.
